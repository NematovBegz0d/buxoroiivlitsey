<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natija — IIV Buxoro Akademik Litseyi</title>
    <link rel="icon" type="image/png" href="../imgs/logo.png" />
    <link rel="stylesheet" href="../kurslar/style.css" />
    <link rel="stylesheet" href="testlar.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="tl-result-page">

    <!-- YUKLANISH -->
    <div class="tl-loading" id="tlLoading">
      <i class="fa-solid fa-spinner"></i>
      <p>Natija yuklanmoqda...</p>
    </div>

    <!-- XATO EKRANI -->
    <div class="tl-error-screen" id="tlError">
      <i class="fa-solid fa-circle-exclamation"></i>
      <h3 id="tlErrorTitle">Xatolik</h3>
      <p id="tlErrorMsg">Natija topilmadi.</p>
      <a href="index.html" class="btn-tl-back" style="margin-top:14px">
        <i class="fa-solid fa-arrow-left"></i> Testlarga qaytish
      </a>
    </div>

    <!-- NATIJA SAHIFASI -->
    <div id="resultContent" style="display:none">

      <!-- HEADER -->
      <header class="tl-result-header">
        <a href="index.html" class="btn-tl-back">
          <i class="fa-solid fa-arrow-left"></i> Testlarga
        </a>
        <span class="tl-result-header-title" id="resultHeaderTitle">Natija</span>
        <a href="../index.html"
           style="display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#8b96a8;font-size:.74rem;font-weight:600;text-decoration:none;">
          <i class="fa-solid fa-house"></i> Asosiy sayt
        </a>
      </header>

      <main class="tl-result-main">

        <!-- BALL DOIRASI -->
        <div class="tl-score-section">
          <div class="tl-score-ring-wrap">
            <svg class="tl-score-ring" viewBox="0 0 160 160" width="160" height="160">
              <circle class="tl-score-ring-bg"   cx="80" cy="80" r="64"/>
              <circle class="tl-score-ring-fill" cx="80" cy="80" r="64" id="ringFill"/>
            </svg>
            <div class="tl-score-ring-text">
              <span class="tl-score-pct">
                <span id="scorePct">0</span><small>%</small>
              </span>
            </div>
          </div>
          <div class="tl-result-title"  id="resultTitle">Natija</div>
          <div class="tl-result-subtitle" id="resultSubtitle"></div>
        </div>

        <!-- STATISTIKA QATORI -->
        <div class="tl-stats-row">
          <div class="tl-stat-card correct">
            <div class="tl-stat-num"   id="statCorrect">0</div>
            <div class="tl-stat-label">To'g'ri</div>
          </div>
          <div class="tl-stat-card wrong">
            <div class="tl-stat-num"   id="statWrong">0</div>
            <div class="tl-stat-label">Noto'g'ri</div>
          </div>
          <div class="tl-stat-card skipped">
            <div class="tl-stat-num"   id="statSkipped">0</div>
            <div class="tl-stat-label">O'tkazilgan</div>
          </div>
          <div class="tl-stat-card duration">
            <div class="tl-stat-num"   id="statTime">—</div>
            <div class="tl-stat-label">Sarflangan vaqt</div>
          </div>
        </div>

        <!-- AMALLAR -->
        <div class="tl-actions">
          <a class="btn-tl-action retry" id="btnRetry" href="#">
            <i class="fa-solid fa-rotate-right"></i> Qayta urinish
          </a>
          <a class="btn-tl-action home" href="index.html">
            <i class="fa-solid fa-list-check"></i> Testlarga qaytish
          </a>
          <button class="btn-tl-action cert" title="Tez orada — BOSQICH 5 da qo'shiladi">
            <i class="fa-solid fa-certificate"></i> Sertifikat
          </button>
        </div>

        <!-- KO'RIB CHIQISH -->
        <div class="tl-review-heading">
          <i class="fa-solid fa-magnifying-glass"></i> Savollar tahlili
        </div>
        <div class="tl-review-list" id="reviewList"></div>

      </main>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
      const LETTERS = ["A", "B", "C", "D", "E"];

      const $ = id => document.getElementById(id);

      function esc(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      function fmtDuration(sec) {
        if (!sec || sec <= 0) return "—";
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return m > 0 ? `${m}m ${s}s` : `${s}s`;
      }

      function ringColor(pct) {
        if (pct >= 85) return "var(--accent-green)";
        if (pct >= 70) return "var(--accent-blue)";
        if (pct >= 50) return "var(--accent-yellow)";
        return "var(--accent-red)";
      }

      function resultLabel(pct) {
        if (pct >= 90) return "Ajoyib natija!";
        if (pct >= 75) return "Yaxshi natija!";
        if (pct >= 55) return "O'rta daraja";
        if (pct >= 35) return "Qo'shimcha mashq kerak";
        return "Yana urinib ko'ring";
      }

      /* ─── RENDER ─── */
      function renderResult(r) {
        const pct     = r.percent ?? Math.round((r.score / r.total) * 100);
        const wrong   = r.total - r.score - (r.answers || []).filter(a => a.selected === -1).length;
        const skipped = (r.answers || []).filter(a => a.selected === -1).length;

        $("resultHeaderTitle").textContent = r.testTitle || "Natija";
        $("scorePct").textContent  = pct;
        $("resultTitle").textContent   = resultLabel(pct);
        $("resultSubtitle").textContent = `${r.testTitle} · ${r.score}/${r.total} savol to'g'ri`;

        $("statCorrect").textContent = r.score;
        $("statWrong").textContent   = Math.max(0, wrong);
        $("statSkipped").textContent = skipped;
        $("statTime").textContent    = fmtDuration(r.durationSec);

        /* Ball doirasi (SVG animatsiya) */
        const ring = $("ringFill");
        const circ = 2 * Math.PI * 64; // r=64 → ≈402.12
        ring.style.strokeDasharray  = circ;
        ring.style.strokeDashoffset = circ;
        ring.style.stroke = ringColor(pct);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ring.style.strokeDashoffset = circ * (1 - pct / 100);
          });
        });

        /* Qayta urinish havolasi */
        $("btnRetry").href = r.testId ? `test.html?id=${encodeURIComponent(r.testId)}` : "index.html";

        /* Savollar ko'rib chiqish */
        if (r.answers && r.answers.length > 0) {
          renderReview(r.answers, r);
        } else {
          $("reviewList").innerHTML = '<p style="color:var(--text-secondary);font-size:0.83rem;padding:12px 0">Savol ma\'lumotlari mavjud emas.</p>';
        }
      }

      function renderReview(answers, r) {
        const list = $("reviewList");
        list.innerHTML = answers.map((a, i) => {
          const isCorrect = a.isCorrect;
          const isSkipped = a.selected === -1 || a.selected === null || a.selected === undefined;
          const statusClass = isSkipped ? "skipped" : (isCorrect ? "correct" : "wrong");
          const badge = isSkipped ? "O'tkazilgan" : (isCorrect ? "To'g'ri" : "Noto'g'ri");

          /* Variantlar */
          const opts = a.options || [];
          const optsHtml = opts.map((opt, oi) => {
            let cls = "tl-review-opt";
            if (oi === a.correct)  cls += " is-correct";
            if (oi === a.selected && !isSkipped) cls += " is-selected" + (oi !== a.correct ? " not-correct" : "");
            const icon = oi === a.correct
              ? '<i class="fa-solid fa-check" style="color:var(--accent-green)"></i>'
              : (oi === a.selected && !isSkipped && oi !== a.correct
                  ? '<i class="fa-solid fa-xmark" style="color:var(--accent-red)"></i>'
                  : `<span style="color:var(--text-muted)">${LETTERS[oi] || (oi+1)}.</span>`);
            return `<div class="${cls}">${icon} ${esc(opt)}</div>`;
          }).join("");

          const correctLetter = a.correct >= 0 ? LETTERS[a.correct] || (a.correct + 1) : "—";
          const selectedLetter = (!isSkipped && a.selected >= 0) ? LETTERS[a.selected] || (a.selected + 1) : "O'tkazilgan";

          return `
            <div class="tl-review-item ${statusClass}" id="ri_${i}">
              <div class="tl-review-head" onclick="toggleReview(${i})">
                <span class="tl-review-num">${i + 1}</span>
                <span class="tl-review-q-text">${esc(a.questionText || `Savol ${i + 1}`)}</span>
                <span class="tl-review-badge">${badge}</span>
                <i class="fa-solid fa-chevron-down tl-review-arrow"></i>
              </div>
              <div class="tl-review-body">
                <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px">
                  <span>Sizning javob: <b style="color:${isSkipped ? 'var(--accent-yellow)' : (isCorrect ? 'var(--accent-green)' : 'var(--accent-red)' )}">${selectedLetter}</b></span>
                  &nbsp;·&nbsp;
                  <span>To'g'ri javob: <b style="color:var(--accent-green)">${correctLetter}</b></span>
                </div>
                ${optsHtml ? `<div class="tl-review-opts">${optsHtml}</div>` : ""}
              </div>
            </div>`;
        }).join("");
      }

      function toggleReview(i) {
        const item = document.getElementById(`ri_${i}`);
        if (item) item.classList.toggle("open");
      }

      /* ─── NATIJANI YUKLASH ─── */
      async function loadResult(rid) {
        /* Avval sessionStorage dan tekshirish */
        const cached = sessionStorage.getItem("tl_last_result");
        if (cached) {
          try {
            const c = JSON.parse(cached);
            if (c.id === rid) {
              sessionStorage.removeItem("tl_last_result");
              return c;
            }
          } catch(_) {}
        }

        /* Firestoredan yuklash */
        const doc = await db.collection("testResults").doc(rid).get();
        if (!doc.exists) throw new Error("Natija topilmadi yoki o'chirilgan.");
        return { id: doc.id, ...doc.data() };
      }

      /* ─── INIT ─── */
      auth.onAuthStateChanged(async u => {
        if (!u) { location.href = "login.html"; return; }

        const rid = new URLSearchParams(location.search).get("rid");
        if (!rid) {
          $("tlLoading").style.display = "none";
          $("tlErrorMsg").textContent = "Natija ID ko'rsatilmagan. URL ni tekshiring.";
          $("tlError").classList.add("show");
          return;
        }

        try {
          const result = await loadResult(rid);
          renderResult(result);
          $("tlLoading").style.display   = "none";
          $("resultContent").style.display = "block";
        } catch(e) {
          $("tlLoading").style.display = "none";
          $("tlErrorMsg").textContent   = e.message;
          $("tlError").classList.add("show");
        }
      });

      window.toggleReview = toggleReview;
    </script>
  </body>
</html>
