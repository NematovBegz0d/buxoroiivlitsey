<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Boshqaruvi — Admin</title>
  <link rel="icon" type="image/png" href="../imgs/logo.png"/>
  <link rel="stylesheet" href="../kurslar/style.css"/>
  <link rel="stylesheet" href="testlar.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <style>
    .ta-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

    .ta-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; margin-bottom: 24px;
      background: var(--bg-card, #1a1f2e);
      border-radius: 12px; border: 1px solid var(--border, rgba(255,255,255,.08));
    }
    .ta-back {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: #8b96a8;
      text-decoration: none; font-size: .8rem; font-weight: 600; transition: all .15s; white-space: nowrap;
    }
    .ta-back:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .ta-header-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .ta-user-chip { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: #8b96a8; white-space: nowrap; }

    .ta-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .ta-section-title { font-size: 1rem; font-weight: 700; flex: 1; }
    .ta-count-badge {
      padding: 3px 10px; border-radius: 20px; font-size: .73rem; font-weight: 600;
      background: rgba(255,255,255,.06); color: #8b96a8;
    }

    .btn-ta {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 8px; font-size: .82rem; font-weight: 600;
      cursor: pointer; border: none; transition: all .15s; font-family: inherit;
    }
    .btn-ta-primary { background: #448aff; color: #fff; }
    .btn-ta-primary:hover { background: #2979ff; }
    .btn-ta-danger  { background: rgba(239,68,68,.14); color: #ef4444; border: 1px solid rgba(239,68,68,.2); }
    .btn-ta-danger:hover  { background: rgba(239,68,68,.24); }
    .btn-ta-ghost   { background: rgba(255,255,255,.06); color: #8b96a8; border: 1px solid rgba(255,255,255,.08); }
    .btn-ta-ghost:hover   { background: rgba(255,255,255,.11); color: #e2e8f0; }
    .btn-ta-warn    { background: rgba(245,158,11,.13); color: #f59e0b; border: 1px solid rgba(245,158,11,.22); }
    .btn-ta-warn:hover    { background: rgba(245,158,11,.22); }
    .btn-ta-sm { padding: 5px 10px; font-size: .75rem; }
    .btn-ta:disabled { opacity: .55; cursor: not-allowed; }

    .ta-tests-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px; margin-bottom: 32px;
    }
    .ta-test-card {
      background: var(--bg-card, #1a1f2e); border-radius: 12px;
      border: 1px solid rgba(255,255,255,.07); padding: 18px; transition: border-color .2s;
    }
    .ta-test-card:hover { border-color: rgba(255,255,255,.14); }
    .ta-test-card.selected { border-color: #448aff88; }
    .ta-test-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .ta-test-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .ta-test-name { font-size: .93rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .ta-test-subject { font-size: .74rem; font-weight: 600; }
    .ta-test-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .ta-meta-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 6px; font-size: .72rem; font-weight: 600;
      background: rgba(255,255,255,.05); color: #8b96a8;
    }
    .ta-meta-chip.active   { background: rgba(16,185,129,.12); color: #10b981; }
    .ta-meta-chip.inactive { background: rgba(239,68,68,.1);   color: #ef4444; }
    .ta-test-actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .ta-q-panel {
      background: var(--bg-card, #1a1f2e); border-radius: 14px;
      border: 1px solid rgba(68,138,255,.25); padding: 22px; margin-bottom: 24px;
    }
    .ta-q-panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .ta-q-panel-title { font-size: .98rem; font-weight: 700; flex: 1; min-width: 160px; }
    .ta-q-panel-sub   { font-size: .76rem; color: #8b96a8; margin-top: 2px; }

    .ta-q-list { display: flex; flex-direction: column; gap: 10px; }
    .ta-q-item {
      background: rgba(255,255,255,.03); border-radius: 10px;
      border: 1px solid rgba(255,255,255,.06); padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .ta-q-num {
      width: 28px; height: 28px; border-radius: 6px; background: rgba(68,138,255,.14);
      color: #448aff; font-size: .78rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
    }
    .ta-q-body { flex: 1; min-width: 0; }
    .ta-q-text { font-size: .88rem; font-weight: 600; margin-bottom: 10px; line-height: 1.45; }
    .ta-q-opts { display: flex; flex-direction: column; gap: 5px; }
    .ta-q-opt  {
      display: flex; align-items: center; gap: 8px;
      font-size: .78rem; color: #8b96a8; padding: 2px 0;
    }
    .ta-q-opt.correct { color: #10b981; font-weight: 700; }
    .ta-q-opt-letter {
      width: 20px; height: 20px; border-radius: 4px; font-size: .7rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: rgba(255,255,255,.06);
    }
    .ta-q-opt.correct .ta-q-opt-letter { background: rgba(16,185,129,.2); color: #10b981; }
    .ta-q-actions { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }

    .ta-empty { text-align: center; padding: 44px 20px; color: #8b96a8; }
    .ta-empty i { font-size: 2.2rem; margin-bottom: 12px; display: block; opacity: .4; }
    .ta-empty-title { font-weight: 600; margin-bottom: 4px; }

    /* Modal */
    .ta-modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .ta-modal-bg.open { opacity: 1; pointer-events: all; }
    .ta-modal {
      background: #1a1f2e; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.11); padding: 28px;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      transform: translateY(16px); transition: transform .2s;
    }
    .ta-modal-bg.open .ta-modal { transform: translateY(0); }
    .ta-modal-head { display: flex; align-items: center; margin-bottom: 22px; }
    .ta-modal-title { font-size: .98rem; font-weight: 700; flex: 1; }
    .ta-modal-close {
      background: none; border: none; color: #8b96a8; font-size: 1.2rem;
      cursor: pointer; padding: 4px; line-height: 1; transition: color .15s;
    }
    .ta-modal-close:hover { color: #e2e8f0; }

    .ta-form-group  { margin-bottom: 16px; }
    .ta-form-label  { display: block; font-size: .79rem; font-weight: 600; margin-bottom: 7px; color: #8b96a8; }
    .ta-form-label .req { color: #ef4444; margin-left: 3px; }
    .ta-form-label .opt { color: #8b96a8; font-weight: 400; font-size: .74rem; }
    .ta-form-input, .ta-form-select, .ta-form-textarea {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 9px 12px; color: #e2e8f0; font-size: .875rem;
      outline: none; transition: border-color .15s; font-family: inherit; box-sizing: border-box;
    }
    .ta-form-input:focus, .ta-form-select:focus, .ta-form-textarea:focus { border-color: #448aff; }
    .ta-form-select option { background: #1a1f2e; }
    .ta-form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    .ta-opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .ta-radio-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .ta-radio-opt {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); transition: all .15s; font-size: .84rem; font-weight: 700;
      user-select: none;
    }
    .ta-radio-opt input { display: none; }
    .ta-radio-opt.checked { background: rgba(16,185,129,.16); border-color: rgba(16,185,129,.4); color: #10b981; }

    .ta-modal-footer {
      display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;
      padding-top: 16px; border-top: 1px solid rgba(255,255,255,.07);
    }

    .ta-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: #1e2438; border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      padding: 10px 22px; font-size: .84rem; font-weight: 600; color: #e2e8f0;
      z-index: 2000; opacity: 0; transition: all .3s; white-space: nowrap; pointer-events: none;
    }
    .ta-toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    .ta-toast.success { border-color: rgba(16,185,129,.4); color: #10b981; }
    .ta-toast.error   { border-color: rgba(239,68,68,.4);  color: #ef4444; }
    .ta-toast.info    { border-color: rgba(68,138,255,.4); color: #448aff; }

    @media (max-width: 600px) {
      .ta-opts-grid { grid-template-columns: 1fr; }
      .ta-tests-grid { grid-template-columns: 1fr; }
      .ta-header { flex-wrap: wrap; }
    }
  </style>
</head>
<body class="tl-page">

<div class="ta-toast" id="toast"></div>

<!-- YUKLANISH -->
<div class="tl-loading" id="pageLoading">
  <i class="fa-solid fa-spinner"></i>
  <p>Tekshirilmoqda...</p>
</div>

<!-- XATO -->
<div class="tl-error-screen" id="pageError">
  <i class="fa-solid fa-ban"></i>
  <h3 id="pageErrorTitle">Kirish taqiqlandi</h3>
  <p id="pageErrorMsg">Bu sahifaga kirish huquqingiz yo'q.</p>
  <a href="../kurslar/login.html" class="btn-tl-back" style="margin-top:14px">
    <i class="fa-solid fa-arrow-left"></i> Loginga qaytish
  </a>
</div>

<!-- ASOSIY KONTENT -->
<div id="pageContent" style="display:none">
  <div class="ta-wrap">

    <!-- HEADER -->
    <div class="ta-header">
      <a href="../kurslar/admin.html" class="ta-back">
        <i class="fa-solid fa-arrow-left"></i> Admin Panel
      </a>
      <div class="ta-header-title">
        <i class="fa-solid fa-pen-to-square" style="color:#448aff;margin-right:8px"></i>
        Test Boshqaruvi
      </div>
      <div class="ta-user-chip">
        <i class="fa-solid fa-user-shield" style="color:#448aff"></i>
        <span id="adminNameChip">Admin</span>
      </div>
    </div>

    <!-- TESTLAR BO'LIMI -->
    <div class="ta-section-head">
      <div class="ta-section-title">Testlar</div>
      <span class="ta-count-badge" id="testsCountBadge">0 ta</span>
      <button class="btn-ta btn-ta-primary" onclick="openTestModal()">
        <i class="fa-solid fa-plus"></i> Yangi test
      </button>
    </div>

    <div class="ta-tests-grid" id="testsGrid"></div>

    <!-- SAVOLLAR PANELI -->
    <div class="ta-q-panel" id="qPanel" style="display:none">
      <div class="ta-q-panel-head">
        <div style="flex:1;min-width:0">
          <div class="ta-q-panel-title" id="qPanelTitle">Savollar</div>
          <div class="ta-q-panel-sub"   id="qPanelSub"></div>
        </div>
        <span class="ta-count-badge" id="qCountBadge">0 ta</span>
        <button class="btn-ta btn-ta-primary" onclick="openQuestionModal()">
          <i class="fa-solid fa-plus"></i> Savol qo'shish
        </button>
        <button class="btn-ta btn-ta-ghost btn-ta-sm" onclick="closeQPanel()" title="Yopish">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="ta-q-list" id="qList"></div>
    </div>

  </div>
</div>

<!-- ══ TEST MODAL ══ -->
<div class="ta-modal-bg" id="testModal" onclick="if(event.target===this)closeTestModal()">
  <div class="ta-modal">
    <div class="ta-modal-head">
      <div class="ta-modal-title" id="testModalTitle">Yangi test</div>
      <button class="ta-modal-close" onclick="closeTestModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="ta-form-group">
      <label class="ta-form-label">Test nomi <span class="req">*</span></label>
      <input class="ta-form-input" id="fTestTitle" placeholder="Masalan: Matematika — Algebra asoslari"/>
    </div>
    <div class="ta-form-group">
      <label class="ta-form-label">Fan <span class="req">*</span></label>
      <select class="ta-form-select" id="fTestSubject">
        <option value="">— Tanlang —</option>
        <option value="matematika">Matematika</option>
        <option value="fizika">Fizika</option>
        <option value="kimyo">Kimyo</option>
        <option value="biologiya">Biologiya</option>
        <option value="psixologiya">Psixologiya</option>
        <option value="ingliz">Ingliz tili</option>
        <option value="tarix">Tarix</option>
        <option value="geografiya">Geografiya</option>
        <option value="informatika">Informatika</option>
        <option value="umumiy">Umumiy</option>
      </select>
    </div>
    <div class="ta-form-group">
      <label class="ta-form-label">
        Vaqt chegarasi (daqiqada)
        <span class="opt">— bo'sh qolsa cheksiz</span>
      </label>
      <input class="ta-form-input" id="fTestTime" type="number" min="1" max="360"
             placeholder="Masalan: 30"/>
    </div>
    <div class="ta-form-group">
      <label class="ta-form-label">
        Tavsif
        <span class="opt">— ixtiyoriy</span>
      </label>
      <textarea class="ta-form-textarea" id="fTestDesc"
                placeholder="Test haqida qisqa ma'lumot..."></textarea>
    </div>

    <div class="ta-modal-footer">
      <button class="btn-ta btn-ta-ghost" onclick="closeTestModal()">Bekor qilish</button>
      <button class="btn-ta btn-ta-primary" id="btnSaveTest" onclick="saveTest()">
        <i class="fa-solid fa-floppy-disk"></i> Saqlash
      </button>
    </div>
  </div>
</div>

<!-- ══ SAVOL MODAL ══ -->
<div class="ta-modal-bg" id="questionModal" onclick="if(event.target===this)closeQuestionModal()">
  <div class="ta-modal">
    <div class="ta-modal-head">
      <div class="ta-modal-title" id="questionModalTitle">Savol qo'shish</div>
      <button class="ta-modal-close" onclick="closeQuestionModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="ta-form-group">
      <label class="ta-form-label">Savol matni <span class="req">*</span></label>
      <textarea class="ta-form-textarea" id="fQText" rows="3"
                placeholder="Savolni kiriting..."></textarea>
    </div>

    <div class="ta-form-group">
      <label class="ta-form-label">Variantlar <span class="req">*</span></label>
      <div class="ta-opts-grid">
        <input class="ta-form-input" id="fOpt0" placeholder="A variant"/>
        <input class="ta-form-input" id="fOpt1" placeholder="B variant"/>
        <input class="ta-form-input" id="fOpt2" placeholder="C variant"/>
        <input class="ta-form-input" id="fOpt3" placeholder="D variant"/>
      </div>
    </div>

    <div class="ta-form-group">
      <label class="ta-form-label">To'g'ri javob <span class="req">*</span></label>
      <div class="ta-radio-row" id="correctRadioRow">
        <label class="ta-radio-opt" data-val="0"><input type="radio" name="correct" value="0"> A</label>
        <label class="ta-radio-opt" data-val="1"><input type="radio" name="correct" value="1"> B</label>
        <label class="ta-radio-opt" data-val="2"><input type="radio" name="correct" value="2"> C</label>
        <label class="ta-radio-opt" data-val="3"><input type="radio" name="correct" value="3"> D</label>
      </div>
    </div>

    <div class="ta-modal-footer">
      <button class="btn-ta btn-ta-ghost" onclick="closeQuestionModal()">Bekor qilish</button>
      <button class="btn-ta btn-ta-primary" id="btnSaveQuestion" onclick="saveQuestion()">
        <i class="fa-solid fa-floppy-disk"></i> Saqlash
      </button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
  const SUBJECTS = {
    matematika:  { label:"Matematika",  color:"#448aff", icon:"fa-square-root-variable" },
    fizika:      { label:"Fizika",      color:"#00bcd4", icon:"fa-atom" },
    kimyo:       { label:"Kimyo",       color:"#ff9800", icon:"fa-flask" },
    biologiya:   { label:"Biologiya",   color:"#00e676", icon:"fa-dna" },
    psixologiya: { label:"Psixologiya", color:"#7c4dff", icon:"fa-brain" },
    ingliz:      { label:"Ingliz tili", color:"#10b981", icon:"fa-language" },
    tarix:       { label:"Tarix",       color:"#ffc107", icon:"fa-landmark" },
    geografiya:  { label:"Geografiya",  color:"#06b6d4", icon:"fa-globe" },
    informatika: { label:"Informatika", color:"#3b82f6", icon:"fa-laptop-code" },
    umumiy:      { label:"Umumiy",      color:"#9ca3af", icon:"fa-list-check" },
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const ADMIN_ROLES = ["admin", "sinf_rahbari", "oqituvchi"];
  const LETTERS = ["A","B","C","D","E"];

  const state = {
    adminUid: null, adminName: "",
    tests: [], selectedTestId: null,
    questions: [], editingTestId: null, editingQId: null,
  };

  /* ── TOAST ── */
  let _toastTimer;
  function toast(msg, type = "success") {
    const el = $("toast");
    el.textContent = msg;
    el.className = `ta-toast ${type} show`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  /* ── RADIO "checked" klassi ── */
  function syncRadioStyles() {
    document.querySelectorAll(".ta-radio-opt").forEach(lbl => {
      const inp = lbl.querySelector("input");
      lbl.classList.toggle("checked", inp?.checked);
    });
  }
  document.addEventListener("change", e => {
    if (e.target.name === "correct") syncRadioStyles();
  });

  /* ── AUTH ── */
  auth.onAuthStateChanged(async u => {
    if (!u) { location.href = "../kurslar/login.html"; return; }
    try {
      const doc = await db.collection("userProfiles").doc(u.uid).get();
      if (!doc.exists) throw new Error("Profil topilmadi.");
      const p = doc.data();
      if (!p.active || !ADMIN_ROLES.includes(p.role))
        throw new Error("Bu sahifaga kirish uchun admin huquqi kerak.");

      state.adminUid  = u.uid;
      state.adminName = p.fullName || p.email || "Admin";
      $("adminNameChip").textContent = state.adminName;

      $("pageLoading").style.display = "none";
      $("pageContent").style.display = "block";
      loadTests();
    } catch(e) {
      $("pageLoading").style.display = "none";
      $("pageErrorMsg").textContent  = e.message;
      $("pageError").classList.add("show");
    }
  });

  /* ── TESTLARNI YUKLASH ── */
  async function loadTests() {
    try {
      const snap = await db.collection("tests").orderBy("createdAt","desc").get();
      state.tests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
      /* createdAt indeksi yo'q bo'lsa tartibsiz yuklash */
      const snap = await db.collection("tests").get();
      state.tests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    renderTests();
  }

  function renderTests() {
    const grid = $("testsGrid");
    $("testsCountBadge").textContent = `${state.tests.length} ta`;

    if (!state.tests.length) {
      grid.innerHTML = `
        <div class="ta-empty" style="grid-column:1/-1">
          <i class="fa-solid fa-inbox"></i>
          <div class="ta-empty-title">Hali test qo'shilmagan</div>
          <p>Yuqoridagi "Yangi test" tugmasini bosing</p>
        </div>`;
      return;
    }

    grid.innerHTML = state.tests.map(t => {
      const info  = SUBJECTS[t.subject] || { label: t.subject||"Umumiy", color:"#9ca3af", icon:"fa-list-check" };
      const color = t.color || info.color;
      const icon  = t.icon  || info.icon;
      const label = t.subjectLabel || info.label;
      const sel   = t.id === state.selectedTestId;

      return `
      <div class="ta-test-card${sel?" selected":""}" id="tcard-${esc(t.id)}">
        <div class="ta-test-card-top">
          <div class="ta-test-icon" style="background:${color}22;color:${color}">
            <i class="fa-solid ${esc(icon)}"></i>
          </div>
          <div style="flex:1;min-width:0">
            <div class="ta-test-name">${esc(t.title)}</div>
            <div class="ta-test-subject" style="color:${color}">${esc(label)}</div>
          </div>
        </div>
        <div class="ta-test-meta">
          <span class="ta-meta-chip">
            <i class="fa-solid fa-circle-question"></i> ${t.questionCount||0} savol
          </span>
          <span class="ta-meta-chip">
            <i class="fa-regular fa-clock"></i> ${t.timeLimit ? t.timeLimit+" daq." : "Cheksiz"}
          </span>
          <span class="ta-meta-chip ${t.active?"active":"inactive"}">
            <i class="fa-solid fa-circle" style="font-size:.45rem"></i>
            ${t.active ? "Faol" : "Nofaol"}
          </span>
        </div>
        <div class="ta-test-actions">
          <button class="btn-ta btn-ta-ghost btn-ta-sm" onclick="selectTest('${esc(t.id)}')">
            <i class="fa-solid fa-list-check"></i> Savollar
          </button>
          <button class="btn-ta btn-ta-ghost btn-ta-sm" onclick="openTestModal('${esc(t.id)}')" title="Tahrirlash">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button class="btn-ta btn-ta-warn btn-ta-sm"
                  onclick="toggleActive('${esc(t.id)}',${!t.active})"
                  title="${t.active?"Nofaol qilish":"Faollashtirish"}">
            <i class="fa-solid ${t.active?"fa-eye-slash":"fa-eye"}"></i>
          </button>
          <button class="btn-ta btn-ta-danger btn-ta-sm" onclick="deleteTest('${esc(t.id)}')" title="O'chirish">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>`;
    }).join("");
  }

  /* ── TEST MODAL ── */
  function openTestModal(testId = null) {
    state.editingTestId = testId;
    const isEdit = !!testId;
    $("testModalTitle").textContent = isEdit ? "Testni tahrirlash" : "Yangi test";
    $("btnSaveTest").innerHTML = `<i class="fa-solid fa-floppy-disk"></i> ${isEdit?"Saqlash":"Qo'shish"}`;

    if (isEdit) {
      const t = state.tests.find(x => x.id === testId);
      if (!t) return;
      $("fTestTitle").value   = t.title || "";
      $("fTestSubject").value = t.subject || "";
      $("fTestTime").value    = t.timeLimit || "";
      $("fTestDesc").value    = t.description || "";
    } else {
      ["fTestTitle","fTestTime","fTestDesc"].forEach(id => $(id).value = "");
      $("fTestSubject").value = "";
    }
    $("testModal").classList.add("open");
    setTimeout(() => $("fTestTitle").focus(), 80);
  }

  function closeTestModal() { $("testModal").classList.remove("open"); }

  async function saveTest() {
    const title   = $("fTestTitle").value.trim();
    const subject = $("fTestSubject").value;
    const time    = parseInt($("fTestTime").value) || null;
    const desc    = $("fTestDesc").value.trim();

    if (!title)   { toast("Test nomini kiriting",  "error"); return; }
    if (!subject) { toast("Fanni tanlang",          "error"); return; }

    const btn = $("btnSaveTest");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saqlanmoqda...';

    const info = SUBJECTS[subject] || {};
    const data = {
      title, subject, description: desc || null,
      subjectLabel: info.label || subject,
      color: info.color || "#9ca3af",
      icon:  info.icon  || "fa-list-check",
      timeLimit: time,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    try {
      if (state.editingTestId) {
        await db.collection("tests").doc(state.editingTestId).update(data);
        toast("Test tahrirlandi ✓");
      } else {
        await db.collection("tests").add({
          ...data, active: false, questionCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: state.adminUid,
        });
        toast("Test qo'shildi ✓");
      }
      closeTestModal();
      await loadTests();
      if (state.selectedTestId) renderTests();
    } catch(e) {
      toast("Xatolik: " + e.message, "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Saqlash';
    }
  }

  /* ── FAOLLASHTIRISH ── */
  async function toggleActive(testId, newVal) {
    try {
      await db.collection("tests").doc(testId).update({ active: newVal });
      toast(newVal ? "Test faollashtirildi ✓" : "Test nofaol qilindi");
      await loadTests();
    } catch(e) {
      toast("Xatolik: " + e.message, "error");
    }
  }

  /* ── TEST O'CHIRISH ── */
  async function deleteTest(testId) {
    const t = state.tests.find(x => x.id === testId);
    if (!confirm(`"${t?.title}" testini o'chirasizmi?\nBarcha savollar ham o'chadi!`)) return;
    try {
      const qSnap = await db.collection("tests").doc(testId).collection("questions").get();
      const batch = db.batch();
      qSnap.docs.forEach(d => batch.delete(d.ref));
      batch.delete(db.collection("tests").doc(testId));
      await batch.commit();
      toast("Test o'chirildi");
      if (state.selectedTestId === testId) closeQPanel();
      await loadTests();
    } catch(e) {
      toast("Xatolik: " + e.message, "error");
    }
  }

  /* ── SAVOLLAR PANELI ── */
  async function selectTest(testId) {
    state.selectedTestId = testId;
    const t = state.tests.find(x => x.id === testId);
    if (!t) return;

    const info = SUBJECTS[t.subject] || { label: t.subject };
    $("qPanelTitle").textContent = t.title;
    $("qPanelSub").textContent   = (info.label||t.subject) + " · " + (t.active ? "Faol ✓" : "Nofaol");
    $("qPanel").style.display    = "block";
    renderTests();
    $("qPanel").scrollIntoView({ behavior:"smooth", block:"start" });
    await loadQuestions(testId);
  }

  function closeQPanel() {
    state.selectedTestId = null;
    state.questions = [];
    $("qPanel").style.display = "none";
    renderTests();
  }

  async function loadQuestions(testId) {
    $("qCountBadge").textContent = "...";
    $("qList").innerHTML = `<div class="ta-empty"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
    try {
      const snap = await db.collection("tests").doc(testId)
        .collection("questions").orderBy("order").get();
      state.questions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
      const snap = await db.collection("tests").doc(testId).collection("questions").get();
      state.questions = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a,b) => (a.order||0)-(b.order||0));
    }
    renderQuestions();
  }

  function renderQuestions() {
    const list = $("qList");
    $("qCountBadge").textContent = `${state.questions.length} ta`;

    if (!state.questions.length) {
      list.innerHTML = `
        <div class="ta-empty">
          <i class="fa-solid fa-circle-question"></i>
          <div class="ta-empty-title">Bu testda hali savollar yo'q</div>
          <p>Yuqoridagi "Savol qo'shish" tugmasini bosing</p>
        </div>`;
      return;
    }

    list.innerHTML = state.questions.map((q, idx) => `
      <div class="ta-q-item">
        <div class="ta-q-num">${idx+1}</div>
        <div class="ta-q-body">
          <div class="ta-q-text">${esc(q.text || q.question || "")}</div>
          <div class="ta-q-opts">
            ${(q.options||[]).map((opt,oi) => `
              <div class="ta-q-opt${oi===q.correct?" correct":""}">
                <div class="ta-q-opt-letter">${LETTERS[oi]||oi+1}</div>
                ${esc(opt)}
                ${oi===q.correct?'<i class="fa-solid fa-check" style="margin-left:6px;font-size:.68rem;opacity:.8"></i>':""}
              </div>`).join("")}
          </div>
        </div>
        <div class="ta-q-actions">
          <button class="btn-ta btn-ta-ghost btn-ta-sm" onclick="openQuestionModal('${esc(q.id)}')" title="Tahrirlash">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button class="btn-ta btn-ta-danger btn-ta-sm" onclick="deleteQuestion('${esc(q.id)}')" title="O'chirish">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>`).join("");
  }

  /* ── SAVOL MODAL ── */
  function openQuestionModal(questionId = null) {
    if (!state.selectedTestId) { toast("Avval test tanlang", "info"); return; }
    state.editingQId = questionId;
    const isEdit = !!questionId;

    $("questionModalTitle").textContent = isEdit ? "Savolni tahrirlash" : "Savol qo'shish";
    $("btnSaveQuestion").innerHTML = `<i class="fa-solid fa-floppy-disk"></i> ${isEdit?"Saqlash":"Qo'shish"}`;

    if (isEdit) {
      const q = state.questions.find(x => x.id === questionId);
      if (!q) return;
      $("fQText").value = q.text || q.question || "";
      (q.options||[]).forEach((opt,i) => { const el=$(`fOpt${i}`); if(el) el.value=opt; });
      document.querySelectorAll('input[name="correct"]').forEach(r => {
        r.checked = parseInt(r.value) === q.correct;
      });
    } else {
      $("fQText").value = "";
      ["fOpt0","fOpt1","fOpt2","fOpt3"].forEach(id => $(id).value = "");
      document.querySelectorAll('input[name="correct"]').forEach(r => r.checked = false);
    }
    syncRadioStyles();
    $("questionModal").classList.add("open");
    setTimeout(() => $("fQText").focus(), 80);
  }

  function closeQuestionModal() { $("questionModal").classList.remove("open"); }

  async function saveQuestion() {
    const text = $("fQText").value.trim();
    const opts = ["fOpt0","fOpt1","fOpt2","fOpt3"].map(id => $(id).value.trim());
    const correctRadio = document.querySelector('input[name="correct"]:checked');

    if (!text)               { toast("Savol matnini kiriting",          "error"); return; }
    if (opts.some(o => !o))  { toast("Barcha 4 variantni to'ldiring",   "error"); return; }
    if (!correctRadio)       { toast("To'g'ri javobni belgilang (A/B/C/D)", "error"); return; }

    const correct = parseInt(correctRadio.value);
    const btn = $("btnSaveQuestion");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saqlanmoqda...';

    const qData = {
      text, options: opts, correct,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    try {
      const qColl = db.collection("tests").doc(state.selectedTestId).collection("questions");
      if (state.editingQId) {
        await qColl.doc(state.editingQId).update(qData);
        toast("Savol tahrirlandi ✓");
      } else {
        const order = (state.questions.length || 0) + 1;
        await qColl.add({ ...qData, order, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        await db.collection("tests").doc(state.selectedTestId).update({
          questionCount: firebase.firestore.FieldValue.increment(1),
        });
        toast("Savol qo'shildi ✓");
      }
      closeQuestionModal();
      await loadQuestions(state.selectedTestId);
      await loadTests();
    } catch(e) {
      toast("Xatolik: " + e.message, "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Saqlash';
    }
  }

  /* ── SAVOL O'CHIRISH ── */
  async function deleteQuestion(questionId) {
    if (!confirm("Bu savolni o'chirasizmi?")) return;
    try {
      await db.collection("tests").doc(state.selectedTestId)
        .collection("questions").doc(questionId).delete();
      await db.collection("tests").doc(state.selectedTestId).update({
        questionCount: firebase.firestore.FieldValue.increment(-1),
      });
      toast("Savol o'chirildi");
      await loadQuestions(state.selectedTestId);
      await loadTests();
    } catch(e) {
      toast("Xatolik: " + e.message, "error");
    }
  }

  /* ── KLAVIATURA ── */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeTestModal(); closeQuestionModal(); }
  });

  window.openTestModal      = openTestModal;
  window.closeTestModal     = closeTestModal;
  window.saveTest           = saveTest;
  window.toggleActive       = toggleActive;
  window.deleteTest         = deleteTest;
  window.selectTest         = selectTest;
  window.closeQPanel        = closeQPanel;
  window.openQuestionModal  = openQuestionModal;
  window.closeQuestionModal = closeQuestionModal;
  window.saveQuestion       = saveQuestion;
  window.deleteQuestion     = deleteQuestion;
</script>
</body>
</html>
