<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish — IIV Buxoro Akademik Litseyi Testlar</title>
    <link rel="icon" type="image/png" href="../imgs/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
      :root {
        --bg:#080b10; --bg-card:#0f1520; --bg-card2:#141d2b;
        --border:rgba(255,255,255,0.07); --border-h:rgba(255,255,255,0.13);
        --txt:#e2e8f0; --txt-2:#8b96a8; --txt-3:#4b5563;
        --blue:#448aff; --blue-g:rgba(68,138,255,0.12);
        --green:#00e676; --green-g:rgba(0,230,118,0.1);
        --red:#ff5252; --red-g:rgba(255,82,82,0.1);
        --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:50px;
        --font:"Inter",system-ui,sans-serif;
      }
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
      html{font-size:14px;}
      body{
        background:var(--bg);color:var(--txt);font-family:var(--font);
        min-height:100vh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:24px 20px;
      }

      /* LOGO */
      .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
      .logo-icon{
        width:40px;height:40px;border-radius:10px;
        background:var(--blue-g);border:1px solid rgba(68,138,255,.25);
        display:flex;align-items:center;justify-content:center;
        color:var(--blue);font-size:1rem;
      }
      .logo-text{font-size:1rem;font-weight:800;color:#fff;}

      /* CARD */
      .card{
        background:var(--bg-card);border:1px solid var(--border);
        border-radius:var(--r-xl);padding:36px 32px;
        width:100%;max-width:420px;
      }

      .card-head{text-align:center;margin-bottom:28px;}
      .card-title{font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:6px;}
      .card-sub{font-size:.82rem;color:var(--txt-2);line-height:1.5;}

      /* FORM */
      .form-group{margin-bottom:16px;}
      .form-label{
        font-size:.78rem;font-weight:600;color:var(--txt-2);
        margin-bottom:6px;display:block;
      }
      .input-wrap{position:relative;}
      .form-input{
        width:100%;padding:11px 14px;
        background:rgba(255,255,255,.04);
        border:1.5px solid var(--border-h);border-radius:var(--r-md);
        color:var(--txt);font-size:.88rem;font-family:var(--font);
        transition:border-color .15s,box-shadow .15s;outline:none;
      }
      .form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(68,138,255,.15);}
      .form-input.error{border-color:var(--red);box-shadow:0 0 0 3px var(--red-g);}
      .form-input::placeholder{color:var(--txt-3);}
      .form-input.has-icon{padding-right:42px;}

      .toggle-pw{
        position:absolute;right:12px;top:50%;transform:translateY(-50%);
        background:none;border:none;color:var(--txt-3);cursor:pointer;
        font-size:.85rem;padding:4px;transition:color .15s;
      }
      .toggle-pw:hover{color:var(--txt-2);}

      /* ALERT */
      .alert{
        padding:11px 14px;border-radius:var(--r-md);
        margin-bottom:16px;font-size:.82rem;
        border:1px solid;display:none;line-height:1.5;
      }
      .alert.error{background:var(--red-g);border-color:rgba(255,82,82,.3);color:#fca5a5;}
      .alert.show{display:block;}

      /* BUTTON */
      .btn-login{
        width:100%;padding:13px;border-radius:var(--r-lg);border:none;
        background:linear-gradient(135deg,var(--blue) 0%,#2066e8 100%);
        color:#fff;font-size:.92rem;font-weight:700;cursor:pointer;
        transition:all .15s;box-shadow:0 4px 20px rgba(68,138,255,.3);
        display:flex;align-items:center;justify-content:center;gap:9px;
        margin-top:4px;
      }
      .btn-login:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 28px rgba(68,138,255,.45);}
      .btn-login:disabled{opacity:.55;cursor:not-allowed;transform:none;}

      /* DIVIDER */
      .divider{
        display:flex;align-items:center;gap:10px;
        margin:20px 0;color:var(--txt-3);font-size:.75rem;
      }
      .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

      /* FOOTER */
      .card-footer{text-align:center;margin-top:20px;font-size:.78rem;color:var(--txt-2);}
      .card-footer a{color:var(--blue);}
      .card-footer a:hover{text-decoration:underline;}

      /* LOADING OVERLAY */
      .load-overlay{
        position:fixed;inset:0;background:rgba(8,11,16,.7);
        backdrop-filter:blur(4px);display:none;
        align-items:center;justify-content:center;z-index:999;
      }
      .load-overlay.show{display:flex;}
      .load-spinner{
        width:44px;height:44px;border:3px solid rgba(68,138,255,.2);
        border-top-color:var(--blue);border-radius:50%;
        animation:spin .7s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg);}}
    </style>
  </head>
  <body>

    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px;margin-bottom:28px;">
      <div class="logo" style="margin-bottom:0;">
        <div class="logo-icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <span class="logo-text">IIV Buxoro Akademik Litseyi — Testlar</span>
      </div>
      <a href="../index.html"
         style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#8b96a8;font-size:.75rem;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;"
         onmouseover="this.style.background='rgba(255,255,255,.08)';this.style.color='#e2e8f0'"
         onmouseout="this.style.background='rgba(255,255,255,.04)';this.style.color='#8b96a8'">
        <i class="fa-solid fa-house"></i> Asosiy sayt
      </a>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Tizimga kirish</div>
        <div class="card-sub">Login va parolingizni kiriting.<br>Ma'lumotlar admin tomonidan yuboriladi.</div>
      </div>

      <div class="alert error" id="alertBox"></div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="fieldEmail">Login (email)</label>
          <input class="form-input" id="fieldEmail" type="email"
                 placeholder="sardor@buxlit.uz" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="fieldPassword">Parol</label>
          <div class="input-wrap">
            <input class="form-input has-icon" id="fieldPassword" type="password"
                   placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1">
              <i class="fa-regular fa-eye" id="togglePwIcon"></i>
            </button>
          </div>
        </div>

        <button class="btn-login" type="submit" id="btnLogin">
          <i class="fa-solid fa-right-to-bracket"></i> Kirish
        </button>

      </form>

      <div class="divider">yoki</div>

      <div class="card-footer">
        Akkauntingiz yo'qmi? <a href="register.html">Ro'yxatdan o'tish</a>
      </div>
      <div class="card-footer" style="margin-top:8px">
        <a href="landing.html"><i class="fa-solid fa-arrow-left" style="font-size:.7rem"></i> Bosh sahifa</a>
      </div>
    </div>

    <div class="load-overlay" id="loadOverlay">
      <div class="load-spinner"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
      /* ── Allaqachon kirgan bo'lsa ── */
      auth.onAuthStateChanged(async user => {
        if (!user || user.isAnonymous) return;
        const profile = await getProfile(user.uid);
        if (profile && profile.role === "student" && profile.active) {
          window.location.replace("index.html");
        }
      });

      /* ── Parolni ko'rsatish/yashirish ── */
      document.getElementById("togglePw").addEventListener("click", () => {
        const inp  = document.getElementById("fieldPassword");
        const icon = document.getElementById("togglePwIcon");
        const show = inp.type === "password";
        inp.type   = show ? "text" : "password";
        icon.className = show ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
      });

      /* ── Login ── */
      document.getElementById("loginForm").addEventListener("submit", async e => {
        e.preventDefault();
        const email    = document.getElementById("fieldEmail").value.trim();
        const password = document.getElementById("fieldPassword").value;
        const alertBox = document.getElementById("alertBox");
        alertBox.classList.remove("show");

        if (!email || !password) {
          alertBox.textContent = "Login va parolni kiriting.";
          alertBox.classList.add("show");
          return;
        }

        const btn = document.getElementById("btnLogin");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Kirilmoqda...';
        document.getElementById("loadOverlay").classList.add("show");

        try {
          const cred = await auth.signInWithEmailAndPassword(email, password);
          const profile = await getProfile(cred.user.uid);

          if (!profile) {
            await auth.signOut();
            throw { message: "Profil topilmadi. Adminga murojaat qiling." };
          }

          if (profile.role !== "student") {
            await auth.signOut();
            throw { message: "Bu sahifa faqat o'quvchilar uchun. Admin panel: /kurslar/login.html" };
          }

          if (!profile.active) {
            await auth.signOut();
            throw { message: "Akkauntingiz faollashtirilmagan. Admin bilan bog'laning." };
          }

          window.location.replace("index.html");

        } catch (err) {
          document.getElementById("loadOverlay").classList.remove("show");
          alertBox.textContent = getErrorMsg(err);
          alertBox.classList.add("show");
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Kirish';
        }
      });

      async function getProfile(uid) {
        try {
          const snap = await db.collection("userProfiles").doc(uid).get();
          return snap.exists ? snap.data() : null;
        } catch { return null; }
      }

      function getErrorMsg(err) {
        const code = err.code || "";
        if (code === "auth/user-not-found")    return "Bu email tizimda yo'q.";
        if (code === "auth/wrong-password")    return "Parol noto'g'ri.";
        if (code === "auth/invalid-email")     return "Email formati noto'g'ri.";
        if (code === "auth/invalid-credential") return "Login yoki parol noto'g'ri.";
        if (code === "auth/too-many-requests") return "Juda ko'p urinish. Biroz kutib qayta urinib ko'ring.";
        if (code === "auth/user-disabled")     return "Akkauntingiz bloklangan. Adminga murojaat qiling.";
        return err.message || "Noma'lum xatolik.";
      }
    </script>
  </body>
</html>
